<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">

    <!-- 공통 CSS & 페이지 전용 CSS -->
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/dashboard.css">

  </head>
  <body>
    
    <div class="header-area">
      <h1>🚚 2W 간선 하차 현황</h1>
      <div id="status-msg" class="status-text">데이터 불러오는 중...</div>
    </div>

    <div class="main-container">
      
      <div class="left-panel">
        
        <div class="card huge-remaining-box">
          <div class="huge-title" id="total-title">총 남은 하차 대수</div>
          <div class="huge-number" id="total-remaining">0</div>
          <div class="type-inner">
            <span id="type-text1">SIOC : 0</span><span id="type-text2">PB : 0</span><span id="type-text3">이형 : 0</span>
          </div>
          <div class="huge-desc">접안 및 대기 차량 포함</div>
        </div>

        <div class="card">
          <h2>📊 하차 진행률</h2>
          
          <div class="progress-item">
            <div class="progress-info">
              <span>1W 간선 (1시 이후)</span>
              <span id="1w-text">0 / 0</span>
            </div>
            <div class="progress-track"><div id="1w-fill" class="progress-fill" style="background-color: #1a73e8;"></div></div>
          </div>

          <div class="progress-item">
            <div class="progress-info">
              <span>2W 간선</span>
              <span id="2w-text">0 / 0</span>
            </div>
            <div class="progress-track"><div id="2w-fill" class="progress-fill" style="background-color: #34a853;"></div></div>
          </div>

          <div class="progress-item">
            <div class="progress-info">
              <span>★ SF부천3 (Pico)</span>
              <span id="pico-text">0 / 0</span>
            </div>
          </div>

          <div class="progress-item">
            <div class="progress-info">
              <span>◇ 부천3 (클러스터)</span>
              <span id="cluster-text">0 / 0</span>
            </div>
          </div>
        </div>

      </div>

      <div class="right-panel">
        <div class="card">
          <h2>📋 하차 대기 차량 목록</h2>
          <div class="list-container" id="full-list">
            <!-- 자바스크립트로 리스트 생성 -->
          </div>
        </div>
      </div>

    </div>

    <script type="module">
      import { initDashboard } from './js/dashboard.js';
      initDashboard();
    </script>
    
  </body>
</html>
