<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>간선차량 체크리스트</title>
  
  <!-- 공통 CSS & 페이지 전용 CSS -->
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/checklist.css">

  <!-- 공통 스크립트 선행 로드 -->
  <script src="./js/config.js"></script>
  <script src="./js/utils.js"></script>
</head>
<body>

  <!-- 헤더 영역 -->
  <header class="header-area">
    <div class="header-left">
      <button type="button" id="addOpenBtn" class="header-btn" onclick="openManualAddModal()">➕</button>
      <button type="button" id="themeToggleBtn" class="header-btn theme-btn" onclick="toggleHighContrastMode()">🌓</button>
    </div>
    
    <div class="title-wrap">
      <h1>🚚 2W 간선차량 목록</h1>
      <div id="status-msg" class="status-text">데이터 불러오는 중...</div>
    </div>
    
    <div class="header-right">
      <button type="button" id="qrOpenBtn" class="header-btn" onclick="openQrModal()" title="모바일 접속 QR코드">
        <svg viewBox="0 0 32 32">
          <path fill-rule="evenodd" d="M5 3a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2H5zm0 2h8v8H5V5z"/>
          <rect x="7" y="7" width="4" height="4" rx="1"/>
          <path fill-rule="evenodd" d="M19 3a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-8zm0 2h8v8h-8V5z"/>
          <rect x="21" y="7" width="4" height="4" rx="1"/>
          <path fill-rule="evenodd" d="M5 17a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2H5zm0 2h8v8H5v-8z"/>
          <rect x="7" y="21" width="4" height="4" rx="1"/>
          <path fill-rule="evenodd" d="M19 17a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-8zm0 2h8v8h-8v-8z"/>
          <rect x="22" y="22" width="2" height="2" rx="0.5"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- 메인 레이아웃 -->
  <main class="main-container">
    <!-- 상단 대시보드 (남은 수량 / 특수 차량) -->
    <section class="top-panel">
      <div class="card">
        <div class="remain">
          <div class="remainItem">
            <div class="remain-info">
              <h2>1W 남은 차량</h2>
              <span id="remain1W-count">0</span>
            </div>
          </div>
          <div class="remainItem">
            <div class="remain-info">
              <h2>2W 남은 차량</h2>
              <span id="remain2W-count">0</span>
            </div>
          </div>
        </div>

        <div class="cluster-item">
          <div class="cluster-info">
            <h2>클러스터 차량번호</h2>
            <div id="cluster-list"></div>
          </div>
        </div>

        <div class="pico-item">
          <div class="pico-info">
            <h2>피코 차량번호</h2>
            <div id="pico-list"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 검색창 -->
    <section class="middle-panel">
      <div class="card">
        <h2>🔎 차량 검색</h2>
        <input type="text" id="searchInput" onkeyup="filterList()" placeholder="차량번호를 입력하세요...">
      </div>
    </section>

    <!-- 실시간 리스트 -->
    <section class="bottom-panel">
      <div class="card">
        <h2 id="list-title">📋 실시간 차량 목록</h2>
        <div class="list-container" id="full-list"></div>
      </div>
    </section>
  </main>

  <!-- [모달 1] 모바일 접속 QR 모달 -->
  <div id="qrModal" class="modal-overlay" onclick="closeQrModalOnOutside(event)">
    <div class="modal-content qr-modal-box">
      <h3>📱 모바일 접속 QR</h3>
      <p id="qrInfo">스마트폰 카메라로 스캔하세요</p>
      <p style="display: none; color: #dc2626;" id="qrErrDetail"></p>
      <img id="qrImage" class="qr-img" src="" alt="접속 QR코드">
      <button type="button" class="close-btn" onclick="closeQrModal()">닫기</button>
    </div>
  </div>

  <!-- [모달 2] 차량 수동 추가 모달 -->
  <div id="addCardModal" class="modal-overlay" onclick="closeCardModalOnOutside(event)">
    <div class="modal-content modal-content-wide">
      <div class="modal-header">
        <h2 style="margin: 0; font-size: 20px;">차량 추가</h2>
        <button class="close-x" onclick="closeCardModal()">×</button>
      </div>
      
      <div class="card-scroll-container" id="cardContainer">
        <div class="btn-add-card" id="btnAddCard" onclick="addNewCard()">+</div>
      </div>
  
      <div class="add-modal-footer">
        <button type="button" class="btn-submit" onclick="submitCardData()">추가하기</button>
        <button type="button" class="btn-cancel" onclick="closeCardModal()">취소</button>
      </div>
    </div>
  </div>

  <!-- [모달 3] 차량 정보 수정 모달 -->
  <div id="checklistEditModal" class="modal-overlay" onclick="closeChecklistEditModalOnOutside(event)">
    <div class="modal-content" style="max-width: 320px;">
      <h3 style="margin-top: 0;">✏️ 차량 정보 수정</h3>
      <input type="hidden" id="chkEditCarId">

      <div class="edit-form-group">
        <label>Wave</label>
        <select id="chkEditWave">
          <option value="1W">1W</option>
          <option value="2W">2W</option>
        </select>
      </div>

      <div class="edit-form-group">
        <label>허브</label>
        <select id="chkEditHub"></select>
      </div>

      <div class="edit-form-group">
        <label>차량번호</label>
        <input type="text" id="chkEditCarNum" placeholder="차량번호 (예: 경기80바6311)">
      </div>

      <div class="edit-modal-btns">
        <button type="button" class="btn-edit-submit" onclick="submitChecklistEdit()">수정 완료</button>
        <button type="button" class="btn-edit-cancel" onclick="closeChecklistEditModal()">취소</button>
      </div>
    </div>
  </div>

  <!-- [공통 로딩 오버레이] UTILS.showLoading 전용 -->
  <div id="uploadOverlay" class="modal-overlay" style="z-index: 10001; flex-direction: column; background: rgba(0,0,0,0.75);">
    <div class="spinner-mini" style="width: 40px; height: 40px; border-width: 4px; margin-bottom: 16px;"></div>
    <div id="uploadOverlayMsg" style="font-size: 20px; font-weight: bold; margin-bottom: 8px; color: white;">처리 중...</div>
    <div id="uploadOverlaySub" style="font-size: 14px; color: #cbd5e1;">잠시만 기다려주세요.</div>
  </div>

    <script>
      const USER_TYPE = UTILS.getUserType();
      
      // 나중에 이 목록은 갖고 올 것
      const HUB_LIST = [
        "직접선택", "클러스터", "SF부천3", "경기광주1", "고양1", "곤지암1", "동탄1", "마장1",
        "목천1", "부천1", "부천2", "서울1", "시흥2", "안산2", "안성4", "안성5",
        "안성8", "이천2", "이천3", "이천4", "인천4", "인천5", "인천11", "인천12",
        "인천14", "인천14CFC", "인천15", "인천16", "인천22", "인천28", "인천30", "인천45",
        "전라광주2", "창원1", "천안2", "천안6", "평택1"
      ];

      let cardIdCounter = 0;
      let currentChecklistData = [];
      var pendingRequests = 0;
      window.syncInterval = null;

      window.onerror = function(msg, url, line) {
        var statusMsg = document.getElementById('status-msg');
        if (statusMsg) {
          statusMsg.innerHTML = "<strong style='color:red;'>에러: " + msg + " (" + line + "줄)</strong>";
        }
      };

      function toggleHighContrastMode() {
        const isContrast = document.body.classList.toggle('high-contrast');
        const btn = document.getElementById('themeToggleBtn');
        
        if (isContrast) {
          localStorage.setItem("THEME_MODE", "high-contrast");
          btn.innerHTML = "☀️";
        } else {
          localStorage.setItem("THEME_MODE", "default");
          btn.innerHTML = "🌓";
        }
      }

      (function initTheme() {
        const savedTheme = localStorage.getItem("THEME_MODE");
        
        if (savedTheme === "high-contrast") {
          // 1. body 클래스는 즉시 추가 (화면 깜빡임 방지)
          document.body.classList.add('high-contrast');
      
          // 2. 버튼 텍스트를 변경하는 함수
          const updateButtonText = () => {
            const btn = document.getElementById('themeToggleBtn');
            if (btn) btn.innerHTML = "☀️";
          };
      
          // 3. 이미 DOM이 로드되었다면 즉시 실행, 아니라면 이벤트 리스너 등록
          if (document.readyState === 'loading') {
            window.addEventListener('DOMContentLoaded', updateButtonText);
          } else {
            updateButtonText();
          }
        }
      })();

      function openManualAddModal() {
        document.getElementById('addCardModal').style.display = 'flex';
        document.getElementById('cardContainer').innerHTML = `<div class="btn-add-card" id="btnAddCard" onclick="addNewCard()">+</div>`;
        addNewCard(); // 기본 카드 1개 생성
      }
      
      // 데이터 유실 방지 검사 함수
      function hasEnteredData() {
        const cards = document.querySelectorAll('.add-card');
        for (let card of cards) {
          // 1. 사진이 업로드되어 있는지 확인
          const img = card.querySelector('.photo-img');
          if (img && img.style.display === 'block') return true;
      
          // 2. 허브나 차량번호에 유효한 값이 들어가 있는지 확인
          const rows = card.querySelectorAll('.card-data-row');
          for (let row of rows) {
            const hub = row.querySelector('.row-hub-select').value;
            const carNum = row.querySelector('.row-carnum-input').value.trim();
            if ((hub !== "직접선택" && hub !== "") || carNum !== "") {
              return true;
            }
          }
        }
        return false;
      }
      
      // 닫기 시도 시 데이터/비용 확인 후 되묻기
      function closeCardModal() {
        if (hasEnteredData()) {
          const confirmClose = confirm(
            "⚠️ 이미 분석되었거나 입력 중인 데이터가 있습니다.\n창을 닫으면 내용이 사라집니다. 정말 닫으시겠습니까?"
          );
          if (!confirmClose) return; // 사용자가 취소를 누르면 닫지 않음
        }
        document.getElementById('addCardModal').style.display = 'none';
      }
      
      function closeCardModalOnOutside(event) {
        if (event.target.id === 'addCardModal') closeCardModal();
      }
      
      // 새 카드 생성
      function addNewCard() {
        cardIdCounter++;
        const cardId = `card_${cardIdCounter}`;
        const fileInputId = `file_${cardIdCounter}`;
        
        const cardHtml = `
          <div class="add-card" id="${cardId}">
            <!-- 1. 사진 영역 -->
            <div class="photo-box-wrap">
              <button type="button" class="btn-del-card" onclick="removeCard(event, '${cardId}')">X</button>
              <label class="photo-box" for="${fileInputId}">
                <span class="photo-text">+ 사진</span>
                <img class="photo-img" src="">
                <div class="photo-loading-overlay" id="loading_${cardId}">
                  <div class="spinner-mini"></div>
                  <span>분석 중...</span>
                </div>
              </label>
              <input type="file" id="${fileInputId}" accept="image/*" style="display: none;" onchange="handleCardCamera(event, '${cardId}')">
            </div>
            
            <!-- 2. Wave 선택 -->
            <select class="wave-select">
              <option value="2W">2W</option>
              <option value="1W">1W</option>
            </select>
            
            <!-- 3. 개별 차량 목록 행 컨테이너 -->
            <div class="card-rows-container" id="rows_${cardId}"></div>
            
            <!-- 4. 행 추가 버튼 -->
            <button type="button" class="btn-add-row" onclick="addCardRow('${cardId}')">+ 행 추가</button>
          </div>
        `;
      
        const container = document.getElementById('cardContainer');
        const addBtn = document.getElementById('btnAddCard');
        addBtn.insertAdjacentHTML('beforebegin', cardHtml);
        
        addCardRow(cardId); // 빈 행 생성
        setTimeout(() => {
          container.scrollTo({ left: container.scrollWidth, behavior: 'smooth' });
        }, 0);
      }

      function deleteItem(itemElement) {
        // 1. 애니메이션 클래스 추가 (사라지는 연출 시작)
        itemElement.classList.add('is-deleting');
      
        // 2. CSS Transition(0.4초)이 끝난 후 DOM에서 완전히 삭제
        itemElement.addEventListener('transitionend', () => {
          itemElement.remove();
        });
      }
      
      // 카드 삭제
      function removeCard(event, cardId) {
        if (event) {
          event.stopPropagation();
          event.preventDefault();
        }
      
        const targetCard = document.getElementById(cardId);
        if (!targetCard) return;
      
        // 1. 해당 카드에 사진이 업로드되었는지 확인
        const img = targetCard.querySelector('.photo-img');
        const hasPhoto = img && img.style.display === 'block';
      
        // 2. 해당 카드 내부 행에 작성된 데이터가 있는지 확인
        let hasData = false;
        const rows = targetCard.querySelectorAll('.card-data-row');
        for (let row of rows) {
          const hub = row.querySelector('.row-hub-select').value;
          const carNum = row.querySelector('.row-carnum-input').value.trim();
          if ((hub !== "직접선택" && hub !== "") || carNum !== "") {
            hasData = true;
            break;
          }
        }
      
        // 3. 사진이나 데이터가 1개라도 있다면 삭제 전 사용자 확인(되묻기)
        if (hasPhoto || hasData) {
          const confirmDelete = confirm(
            "⚠️ 이 카드에 이미 분석된 사진이나 입력된 데이터가 있습니다.\n정말 이 카드를 삭제하시겠습니까?"
          );
          if (!confirmDelete) return; // 취소 누르면 삭제 중단
        }
      
        // 데이터가 없거나, 확인을 누른 경우에만 최종 삭제
        deleteItem(targetCard);
      }
      
      // 허브 드롭다운 옵션 HTML 생성기
      function generateHubOptions(selectedHub = "") {
        let isMatched = false;
        let optionsHtml = HUB_LIST.map(hub => {
          const isSelected = (hub === selectedHub);
          if (isSelected) isMatched = true;
          return `<option value="${hub}" ${isSelected ? 'selected' : ''}>${hub}</option>`;
        }).join('');
      
        // 만약 AI가 인식한 허브가 표준 목록에 없다면, 옵션 맨 위에 강제로 추가해 값 유실 방지
        if (selectedHub && !isMatched && selectedHub !== "직접선택") {
          optionsHtml = `<option value="${selectedHub}" selected>${selectedHub}</option>` + optionsHtml;
        }
        return optionsHtml;
      }
      
      // 카드 내부에 [허브드롭다운 + 차량번호] 행 추가
      function addCardRow(cardId, hub = "", carNum = "") {
        const rowsContainer = document.getElementById(`rows_${cardId}`);
        if (!rowsContainer) return;
      
        const rowDiv = document.createElement('div');
        rowDiv.className = 'card-data-row';
      
        // 시트 복사-붙여넣기 감지 이벤트 (onpaste)
        const pasteHandler = `onpaste="handleCardRowPaste(event, '${cardId}', this)"`;
      
        rowDiv.innerHTML = `
          <select class="row-hub-select">
            ${generateHubOptions(hub)}
          </select>
          <input type="text" class="row-carnum-input" placeholder="차량번호" value="${carNum}" ${pasteHandler}>
          <button type="button" class="row-del-btn" onclick="this.parentElement.remove()">×</button>
        `;
      
        rowsContainer.appendChild(rowDiv);
        rowsContainer.scrollTop = rowsContainer.scrollHeight;
      }
      
      // 엑셀/스프레드시트 데이터 붙여넣기 자동 파싱 처리
      function handleCardRowPaste(e, cardId, currentInput) {
        const pasteData = (e.clipboardData || window.clipboardData).getData('text');
        if (pasteData.includes('\t') || pasteData.includes('\n')) {
          e.preventDefault();
          const lines = pasteData.split('\n').filter(line => line.trim() !== '');
      
          const currentRow = currentInput.closest('.card-data-row');
          
          lines.forEach((line, index) => {
            const parts = line.trim().split(/[\t ]+/);
            const hub = parts[0] || "";
            const carNum = parts[1] || "";
      
            if (index === 0) {
              // 첫 줄은 현재 입력창 행에 적용
              const hubSelect = currentRow.querySelector('.row-hub-select');
              hubSelect.innerHTML = generateHubOptions(hub);
              currentRow.querySelector('.row-carnum-input').value = carNum;
            } else {
              // 두 번째 줄부터는 아래에 새 행 생성
              addCardRow(cardId, hub, carNum);
            }
          });
        }
      }
      
      // 사진 촬영 및 AI OCR 파싱
      function handleCardCamera(event, cardId) {
        const file = event.target.files[0];
        if (!file) return;
      
        const card = document.getElementById(cardId);
        const imgEl = card.querySelector('.photo-img');
        const textEl = card.querySelector('.photo-text');
        const loadingOverlay = document.getElementById(`loading_${cardId}`);
        const rowsContainer = document.getElementById(`rows_${cardId}`);
      
        // 1. 로딩 UI 표시 (오버레이 ON + 행 영역 안내 문구)
        loadingOverlay.style.display = 'flex';
        rowsContainer.innerHTML = `<div class="loading-row-placeholder">AI 텍스트 추출 중...<br>잠시만 기다려주세요.</div>`;
      
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            // 이미지 클라이언트 사이드 압축 (1000px, 70% 압축)
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const MAX_SIZE = 1000;
            let w = img.width, h = img.height;
            if (w > h) { if (w > MAX_SIZE) { h *= MAX_SIZE / w; w = MAX_SIZE; } } 
            else { if (h > MAX_SIZE) { w *= MAX_SIZE / h; h = MAX_SIZE; } }
            canvas.width = w; canvas.height = h;
            ctx.drawImage(img, 0, 0, w, h);
            
            const compressedBase64 = canvas.toDataURL("image/jpeg", 0.7);
      
            // 미리보기 세팅
            imgEl.src = compressedBase64;
            imgEl.style.display = 'block';
            textEl.style.display = 'none';
      
            // 2. 워커 AI 호출
            const targetUrl = CONFIG.WORKER_URL;
            UTILS.apiFetch(`${targetUrl}?action=extractOcrAI`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ imageBase64: compressedBase64.split(',')[1] })
            })
            .then(res => res.json())
            .then(result => {
              rowsContainer.innerHTML = ''; // 플레이스홀더 제거
              if (result.status === "success") {
                if (result.imageId) {
                  card.dataset.imageId = result.imageId;
                }
            
                if (result.data && result.data.length > 0) {
                  result.data.forEach(item => {
                    if (item.지역 || item.차량번호) {
                      addCardRow(cardId, item.지역 || "", item.차량번호 || "");
                    }
                  });
                }
              } else {
                alert("AI 인식 실패: " + (result.message || "추출된 결과가 없습니다."));
                addCardRow(cardId); // 실패 시 빈칸 1개 복원
              }
            })
            .catch(err => {
              rowsContainer.innerHTML = '';
              alert("통신 오류 발생");
              addCardRow(cardId);
            })
            .finally(() => {
              // 로딩 오버레이 OFF
              loadingOverlay.style.display = 'none';
            });
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
      
      // 최종 서버 전송
      function submitCardData() {
        const cards = document.querySelectorAll('.add-card');
        const cardPayloads = [];
      
        cards.forEach(card => {
          const serverImageId = card.dataset.imageId;
          const hasPhoto = Boolean(serverImageId);
          const parentId = serverImageId || UTILS.generateUniqueID();
          
          const wave = card.querySelector('.wave-select').value;
          const rows = card.querySelectorAll('.card-data-row');

          const vehicles = [];
          rows.forEach(row => {
            let hub = row.querySelector('.row-hub-select').value;
            const carNum = row.querySelector('.row-carnum-input').value.trim();
      
            if (hub === "직접선택") hub = "";
      
            // 허브가 적혀있다면 전송 대상에 포함
            if (hub !== "") {
              vehicles.push({ hub: hub, carNum: carNum });
            }
          });
          
          if (vehicles.length > 0) {
            cardPayloads.push({
              wave: wave,
              parentId: parentId,
              hasPhoto: hasPhoto,
              vehicles: vehicles
            });
          }
        });
      
        if (cardPayloads.length === 0) return alert("추가할 차량 데이터가 없습니다.");

        UTILS.showLoading("🚚 차량 추가 중...","서버에 차량을 등록 중입니다.");
      
        const targetUrl = CONFIG.WORKER_URL;
        UTILS.apiFetch(`${targetUrl}?action=addManualList`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ cardPayloads: cardPayloads })
        })
        .then(res => res.json())
        .then(result => {
          UTILS.hideLoading();
          if (result.status === "success") {
            UTILS.showToast(`✅ ${result.message}`);

            document.getElementById('cardContainer').innerHTML = '';
            document.getElementById('addCardModal').style.display = 'none';
            
            fetchData(false);
          } else {
            alert("추가 실패: " + result.message);
          }
        })
        .catch(err => {
          UTILS.hideLoading();
          alert("통신 에러 발생");
        });
      }

      function openQrModal() {
        var modal = document.getElementById('qrModal');
        var qrInfo = document.getElementById('qrInfo');
        var qrImage = document.getElementById('qrImage');
        var qrErrDetail = document.getElementById('qrErrDetail');

        qrImage.style.display = 'none';
        qrErrDetail.style.display = 'none';
        UTILS.apiFetch(`${CONFIG.WORKER_URL}?action=generateGuestLink`)
          .then(response => response.json())
          .then(result => {
            if (result.status === "error") {
              qrInfo.innerText = "❌ 인증 오류"
              qrErrDetail.innerText = result.message;
              qrErrDetail.style.display = 'block';
              return;
            }
            qrImage.style.display = 'block';
            qrImage.src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(result.data);
          })
          .catch(error => {
            qrInfo.innerText = "❌ 서버 에러"
            qrErrDetail.innerText = error.message;
            qrErrDetail.style.display = 'block';
          });

        modal.classList.add('active');
      }

      function closeQrModal() {
        var modal = document.getElementById('qrModal');
        modal.classList.remove('active');
      }

      function closeQrModalOnOutside(event) {
        if (event.target.id === 'qrModal') {
          closeQrModal();
        }
      }

      function openChecklistEditModal(event, btnElement) {
        event.stopPropagation(); // 체크박스나 행 클릭 방지
      
        const cId = btnElement.getAttribute('data-cid');
        const wave = btnElement.getAttribute('data-wave');
        const hub = btnElement.getAttribute('data-hub');
        const carNum = btnElement.getAttribute('data-carnum');
      
        document.getElementById('chkEditCarId').value = cId;
        document.getElementById('chkEditWave').value = wave || "2W";
        document.getElementById('chkEditCarNum').value = carNum || "";
      
        // 허브 드롭다운 채우기
        const hubSelect = document.getElementById('chkEditHub');
        let isMatched = false;
        let optionsHtml = HUB_LIST.map(h => {
          const isSelected = (h === hub);
          if (isSelected) isMatched = true;
          return `<option value="${h}" ${isSelected ? 'selected' : ''}>${h}</option>`;
        }).join('');
      
        if (hub && !isMatched && hub !== "직접선택") {
          optionsHtml = `<option value="${hub}" selected>${hub}</option>` + optionsHtml;
        }
        hubSelect.innerHTML = optionsHtml;
      
        document.getElementById('checklistEditModal').classList.add('active');
      }
      
      function closeChecklistEditModal() {
        document.getElementById('checklistEditModal').classList.remove('active');
      }
      
      function closeChecklistEditModalOnOutside(event) {
        if (event.target.id === 'checklistEditModal') closeChecklistEditModal();
      }
      
      // 2. 수정 내용 백엔드(Worker)로 전송
      function submitChecklistEdit() {
        const carId = document.getElementById('chkEditCarId').value;
        const wave = document.getElementById('chkEditWave').value;
        const hub = document.getElementById('chkEditHub').value;
        const carNumber = document.getElementById('chkEditCarNum').value.trim();
      
        if (hub === "직접선택" || hub === "") {
          return alert("허브를 올바르게 선택해 주세요.");
        }
      
        const payload = { carId, wave, hub, carNumber };

        closeChecklistEditModal();
        UTILS.showLoading("⏳ 차량 정보 수정 중...", "서버에 반영 중입니다.");
        
        const targetUrl = CONFIG.WORKER_URL;
        UTILS.apiFetch(`${targetUrl}?action=editVehicle`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(result => {
          UTILS.hideLoading();
          if (result.status === "success") {
            UTILS.showToast("✅ 차량 정보가 수정되었습니다.");
            fetchData(false);
          } else {
            alert("수정 실패: " + result.message);
          }
        })
        .catch(err => {
          UTILS.hideLoading();
          alert("통신 오류가 발생했습니다.");
        });
      }
      
      // 3. 차량 삭제 요청 (확인창)
      function confirmDeleteChecklistCar(event, btnElement) {
        event.stopPropagation(); // 체크박스나 행 클릭 방지
      
        const cId = btnElement.getAttribute('data-cid');
        const carInfo = btnElement.getAttribute('data-info');
      
        const confirmDel = confirm(
          `🚨 [${carInfo}] 차량을 삭제하시겠습니까?\n이 작업은 복구할 수 없습니다.`
        );
        if (!confirmDel) return;

        UTILS.showLoading("⏳ 차량 정보 수정 중...", "서버에 반영 중입니다.");
        
        const targetUrl = CONFIG.WORKER_URL;
        UTILS.apiFetch(`${targetUrl}?action=deleteVehicle`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ carId: cId })
        })
        .then(res => res.json())
        .then(result => {
          UTILS.hideLoading();
          if (result.status === "success") {
            UTILS.showToast("🗑️ 차량이 성공적으로 삭제되었습니다.");
            fetchData(false);
          } else {
            alert("삭제 실패: " + result.message);
          }
        })
        .catch(err => {
          UTILS.hideLoading();
          alert("통신 오류가 발생했습니다.");
        });
      }

      function filterList() {
        var searchInput = document.getElementById('searchInput').value;
        var query = searchInput.toLowerCase().trim();
        var listInner = document.getElementById('list-inner');
        if (!listInner) return;

        var items = listInner.querySelectorAll('.list-item:not(#noResultItem)');
        var listTitle = document.getElementById('list-title');

        if (query === '') {
          listTitle.innerText = '📋 전체 차량 목록';
        } else {
          listTitle.innerText = '🔎 검색 차량 목록';
        }

        var visibleCount = 0;
        items.forEach(function(item) {
          var text = item.textContent.toLowerCase();
          if (text.includes(query)) {
            item.style.display = 'flex';
            visibleCount++;
          } else {
            item.style.display = 'none';
          }
        });

        var noResultEl = document.getElementById('noResultItem');
        if (visibleCount === 0) {
          if (!noResultEl) {
            noResultEl = document.createElement('div');
            noResultEl.id = 'noResultItem';
            noResultEl.className = 'list-item';
            noResultEl.style.cursor = 'default';
            noResultEl.style.justifyContent = 'center';
            noResultEl.innerHTML = '<span class="car-info" style="text-align: center; color: #888; margin: 0;"><small>🔍❓ 일치하는 검색 결과가 없습니다.</small></span>';
            listInner.appendChild(noResultEl);
          } else {
            noResultEl.style.display = 'flex';
          }
        } else {
          if (noResultEl) {
            noResultEl.style.display = 'none';
          }
        }
      }

      function markAsArrived(cId, btnElement) {
        btnElement.disabled = true;

        // 대상 차량 찾기
        const target = currentChecklistData.find(item => item.cId === cId);
        if (!target) {
          btnElement.disabled = false;
          return;
        }

        // 롤백을 위해 이전 상태 백업
        const prevArr = target.arr;
        const prevTime = target.aTime;

        // 낙관적 상태 즉시 변경
        target.arr = !prevArr;
        target.aTime = target.arr ? Date.now() : 0;

        // 로컬 캐시 즉시 저장 및 화면 즉각 렌더링
        localStorage.setItem("CACHED_DATA", JSON.stringify(currentChecklistData));
        updateUI(currentChecklistData);

        // 가벼운 터치 햅틱 반응 (현장 터치감 극대화)
        if (navigator.vibrate) navigator.vibrate(25);

        // 백그라운드 서버 전송
        stopSyncInterval();
        pendingRequests++;

        UTILS.apiFetch(`${CONFIG.WORKER_URL}?action=toggleCheck&cId=${cId}`, { redirect: "follow" })
          .then(res => res.json())
          .then(result => {
            pendingRequests--;
            const isError = (result.status === "error") || (result.result && !result.result.success);

            if (isError) {
              // 실패 시 원래 상태로 롤백
              target.arr = prevArr;
              target.aTime = prevTime;
              localStorage.setItem("CACHED_DATA", JSON.stringify(currentChecklistData));
              updateUI(currentChecklistData);
              alert(result.message || "상태 변경 실패: 원래 상태로 복구합니다.");
            }
            if (pendingRequests === 0) checkWorkTimeAndSync();
          })
          .catch(err => {
            pendingRequests--;
            // 통신 에러 시 원래 상태로 롤백
            target.arr = prevArr;
            target.aTime = prevTime;
            localStorage.setItem("CACHED_DATA", JSON.stringify(currentChecklistData));
            updateUI(currentChecklistData);
            alert("네트워크 연결 오류로 상태를 복구합니다.");
            if (pendingRequests === 0) checkWorkTimeAndSync();
          });
      }

      function checkWorkTimeAndSync() {
        fetchData(true);
        stopSyncInterval();

        if (document.hidden) return;

        var searchInput = document.getElementById('searchInput');
        if (searchInput && searchInput.value.trim().length > 0) return;
        
        window.syncInterval = setInterval(function() {
          var currentHour = new Date().getHours();
          if (currentHour < CONFIG.SYNC.WORK_END_HOUR) {
            if (document.getElementById('searchInput').value.trim().length === 0) {
              fetchData();
            }
          } else {
            document.getElementById('status-msg').innerText = "⏹️ 2W 근무 종료.. 자동 동기화 중지";
            stopSyncInterval();
          }
        }, CONFIG.SYNC.CHECKLIST_MS);
      }

      function stopSyncInterval() {
        if (window.syncInterval) {
          clearInterval(window.syncInterval);
          window.syncInterval = null;
        }
      }

      function fetchData(useCache = true) {

        if (pendingRequests > 0) return;
        
        document.getElementById('status-msg').innerText = "데이터 동기화 중...";

        if (useCache) {
          const cachedData = localStorage.getItem("CACHED_DATA");
          if (cachedData) {
            try {
              currentChecklistData = JSON.parse(cachedData);
              updateUI(JSON.parse(cachedData));
            } catch(e) {}
          }
        }

        UTILS.apiFetch(`${CONFIG.WORKER_URL}?action=getChecklistData`)
          .then(response => response.json())
          .then(result => {
            if (result.status === "error") {
              document.getElementById('status-msg').innerText = "❌ 인증 오류: " + result.message;
              return;
            }
            if (pendingRequests > 0) return;
            currentChecklistData = result.data || [];
            localStorage.setItem("CACHED_DATA", JSON.stringify(currentChecklistData));
            updateUI(currentChecklistData); // 성공 시 기존 updateUI 함수 호출
          })
          .catch(error => {
            document.getElementById('status-msg').innerText = "❌ 서버 에러: " + error.message;
          });
      }

      function updateUI(data) {
        
        var now = new Date();
        var timeStr = [
          String(now.getHours()).padStart(2, '0'),
          String(now.getMinutes()).padStart(2, '0'),
          String(now.getSeconds()).padStart(2, '0')
        ].join(':');
        document.getElementById('status-msg').innerText = "✅ 마지막 업데이트: " + timeStr;

        var isNotBucheon = function(hub) { return !String(hub).includes("부천3"); };
        var wave = function(carId) { return String(carId).substr(0, 2); };

        var dataSummary = (data || []).reduce(function(acc, item) {
          var cId = item.cId, hub = item.hub, carN = item.carN, arr = item.arr;

          if (wave(cId) === "1W") {
            if (isNotBucheon(hub)) {
              acc.max1WLength++;
              if (arr) acc.arrival1WLength++;
            } else {
              acc.picoCarNumbers.push(carN);
            }
          } 
          if (wave(cId) === "2W") {
            if (isNotBucheon(hub)) {
              acc.max2WLength++;
              if (arr) acc.arrival2WLength++;
            } else {
              acc.clusterCarNumbers.push(carN);
            }
          }
          return acc;
        }, {
          max1WLength: 0, arrival1WLength: 0,
          max2WLength: 0, arrival2WLength: 0,
          picoCarNumbers: [], clusterCarNumbers: []
        });

        document.getElementById('pico-list').innerText = Array.from(new Set(dataSummary.picoCarNumbers)).join('\n');
        document.getElementById('cluster-list').innerText = Array.from(new Set(dataSummary.clusterCarNumbers)).join('\n');

        document.getElementById('remain1W-count').innerText = dataSummary.max1WLength - dataSummary.arrival1WLength;
        document.getElementById('remain2W-count').innerText = dataSummary.max2WLength - dataSummary.arrival2WLength;

        var listContainer = document.getElementById('full-list');
        listContainer.innerHTML = '<div class="list-inner" id="list-inner"></div>'; 
        var listInner = document.getElementById('list-inner'); 

        var activeCarMap = new Map();
        var filteredData = [];
  
        (data || []).forEach(function(item) {
          if (item.unl) {
            // 하차 완료된 차량은 중복 여부 상관없이 모두 추가
            filteredData.push(item);
          } else {
            // 대기중 / 미도착 차량 중복 제거
            var safeCarNum = String(item.carN).replace(/\s+/g, '');
            var uniqueKey = item.hub + "_" + wave(item.cId) + "_" + safeCarNum;
  
            if (!activeCarMap.has(uniqueKey)) {
              activeCarMap.set(uniqueKey, item); // 처음 본 차량이면 저장
            } else {
              var existing = activeCarMap.get(uniqueKey);
              // 기존 저장된 차가 '미도착'인데, 지금 검사하는 차가 '대기중'이면 덮어씌움 (대기중 우선)
              if (!existing.arr && item.arr) {
                activeCarMap.set(uniqueKey, item);
              }
            }
          }
        });
  
        // Map에 걸러진 1개의 고유 대기/미도착 차량들을 배열에 합침
        activeCarMap.forEach(function(value) {
          filteredData.push(value);
        });

        var getPriority = function(item) {
          if (!item.arr) return 1;
          if (item.arr && !item.unl) return 2; 
          return 3;                                         
        };

        var sortedData = filteredData.sort(function(a, b) {
          var priorityA = getPriority(a);
          var priorityB = getPriority(b);
          
          if (priorityA !== priorityB) return priorityA - priorityB;
          
          if (priorityA === 1) {
            var waveA = wave(a.cId);
            var waveB = wave(b.cId);
            if (waveA !== waveB) {
              return waveA.localeCompare(waveB); // "1W"가 "2W"보다 먼저 정렬
            }
            return (a.rIdx || 0) - (b.rIdx || 0);
          }
          
          if (priorityA === 2) {
            if (a.aTime && b.aTime && a.aTime !== b.aTime) {
              return a.aTime - b.aTime;
            }
            return (a.rIdx || 0) - (b.rIdx || 0);
          }

          return (a.rIdx || 0) - (b.rIdx || 0);
        });

        const listItemsHTML = [];

        sortedData.forEach(function(item) {
          var cId = item.cId, rIdx = item.rIdx, hub = item.hub, carN = item.carN, arr = item.arr, unl = item.unl;

          // if (String(hub).includes("부천3") && !arr) return;

          var badgeClass = "not-arrived";
          var checkIcon = CONFIG.ICONS.empty;

          if (unl) {
            badgeClass = "unloaded";
            checkIcon = CONFIG.ICONS.doubleChecked;
          } else if (arr) {
            badgeClass = "waiting";
            checkIcon = CONFIG.ICONS.checked;
          }
          
          var itemWave = wave(cId);
          const prefix = (itemWave === "1W") ? "★" : (CONFIG.FRESH_HUBS.has(hub) ? "◇" : "");
          const hubStr = UTILS.getHubDisplayName(hub);
          var carInfo = UTILS.escapeHtml(prefix + hubStr + " | " + carN);
          var isBucheon = String(hub).includes("부천3");

          listItemsHTML.push( 
            '<div class="list-item ' + badgeClass + '" data-row-idx="' + rIdx + '" data-wave="' + itemWave + '" data-bucheon="' + isBucheon + '">' +
              '<button onclick="markAsArrived(\'' + cId + '\', this)" class="checkBox" ' + (unl ? 'disabled' : '') + '>' +
                checkIcon +
              '</button>' +
              '<span class="car-info ' + (unl ? "text-unloaded" : "") + (item.isChanged ? " changed" : "") + '">' + carInfo + '</span>' +
              ((!unl && USER_TYPE !== "guest") ? (
                '<div class="item-actions">' +
                  '<button type="button" class="btn-item-action btn-item-edit" title="수정" ' +
                    'data-cid="' + cId + '" data-wave="' + itemWave + '" data-hub="' + hub + '" data-carnum="' + carN + '" ' +
                    'onclick="openChecklistEditModal(event, this)">✏️</button>' +
                  '<button type="button" class="btn-item-action btn-item-del" title="삭제" ' +
                    'data-cid="' + cId + '" data-info="' + carInfo + '" ' +
                    'onclick="confirmDeleteChecklistCar(event, this)">🗑️</button>' +
                '</div>'
              ) : '') +

            '</div>');
        });
        
        listInner.innerHTML = listItemsHTML.join('');
        filterList();
      }

      window.addEventListener('DOMContentLoaded', function() {
        if (USER_TYPE === "guest") {
          const qrBtn = document.getElementById('qrOpenBtn');
          if (qrBtn) qrBtn.style.display = 'none';
          const addBtn = document.getElementById('addOpenBtn');
          if (addBtn) addBtn.style.display = 'none';
        }
        setTimeout(checkWorkTimeAndSync, 500);
      });

      document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
          stopSyncInterval();
          var searchInput = document.getElementById('searchInput');
          if (searchInput) searchInput.value = "";
        } else {
          checkWorkTimeAndSync(); 
        }
      });
    </script>
  </body>
