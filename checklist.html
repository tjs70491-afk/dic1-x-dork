<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>간선차량 체크리스트</title>

  <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png">
  
  <!-- 공통 CSS & 페이지 전용 CSS -->
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/checklist.css">

</head>
<body>

  <!-- 헤더 영역 -->
  <header class="header-area">
    <div class="header-left">
      <button type="button" id="addOpenBtn" class="header-btn" data-action="open-BatchCarManager">➕</button>
      <button type="button" id="themeToggleBtn" class="header-btn theme-btn" data-action="theme-change">🌓</button>
    </div>
    
    <div class="title-wrap">
      <h1>🚚 2W 간선차량 목록</h1>
      <div id="status-msg" class="status-text">데이터 불러오는 중...</div>
    </div>
    
    <div class="header-right">
      <button type="button" id="qrOpenBtn" class="header-btn" data-action="open-QR-modal" title="모바일 접속 QR코드">
        <svg viewBox="0 0 32 32">
          <path fill-rule="evenodd" d="M5 3a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2H5zm0 2h8v8H5V5z"/>
          <rect x="7" y="7" width="4" height="4" rx="1"/>
          <path fill-rule="evenodd" d="M19 3a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-8zm0 2h8v8h-8V5z"/>
          <rect x="21" y="7" width="4" height="4" rx="1"/>
          <path fill-rule="evenodd" d="M5 17a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2H5zm0 2h8v8H5v-8z"/>
          <rect x="7" y="21" width="4" height="4" rx="1"/>
          <path fill-rule="evenodd" d="M19 17a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-8zm0 2h8v8h-8v-8z"/>
          <rect x="22" y="22" width="2" height="2" rx="0.5"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- 메인 레이아웃 -->
  <main class="main-container">
    <!-- 상단 대시보드 (남은 수량 / 특수 차량) -->
    <section class="top-panel">
      <div class="card">
        <div class="remain">
          <div class="remainItem">
            <div class="remain-info">
              <h2>1W 남은 차량</h2>
              <span id="remain1W-count">0</span>
            </div>
          </div>
          <div class="remainItem">
            <div class="remain-info">
              <h2>2W 남은 차량</h2>
              <span id="remain2W-count">0</span>
            </div>
          </div>
        </div>

        <div class="cluster-item">
          <div class="cluster-info">
            <h2>클러스터 차량번호</h2>
            <div id="cluster-list"></div>
          </div>
        </div>

        <div class="pico-item">
          <div class="pico-info">
            <h2>피코 차량번호</h2>
            <div id="pico-list"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 검색창 -->
    <section class="middle-panel">
      <div class="card">
        <h2>🔎 차량 검색</h2>
        <input type="text" id="searchInput" placeholder="차량번호를 입력하세요...">
      </div>
    </section>

    <!-- 실시간 리스트 -->
    <section class="bottom-panel">
      <div class="card" id="car-list">
        <div class="list-card-header">
          <h2 id="list-title" style="margin: 0;">📋 실시간 차량 목록</h2>
          <button type="button" 
                  class="btn-single-add"
                  data-action="open-SingleCarManager"
                  data-mode="add"
                  title="차량 1대 빠른 추가">
            ➕ 차량 추가
          </button>
        </div>
        <div class="list-container" id="full-list"></div>
      </div>
    </section>
  </main>

  <!-- 게스트용 QR 모달 -->
  <div id="qrModal" class="modal-overlay"></div>

  <!-- 복수 차량 관리 모달 -->
  <div id="batchCarManager" class="modal-overlay">
    <div class="modal-content modal-content-wide">
      <div class="modal-header">
        <h2 style="margin: 0; font-size: 20px;">차량 추가</h2>
        <button class="close-x" data-action="close-BatchCarManager">&times;</button>
      </div>
      
      <div class="card-scroll-container" id="cardContainer"></div>
  
      <div class="batchCarManager-footer">
        <button type="button" class="btn-submit" data-action="submit-cards">추가하기</button>
        <button type="button" class="btn-cancel" data-action="close-BatchCarManager">취소</button>
      </div>
    </div>
  </div>

  <!-- 단일 차량 관리 모달 -->
  <div id="singleCarManager" class="modal-overlay"></div>

  <!-- [공통 로딩 오버레이] UTILS.showLoading 전용 -->
  <div id="uploadOverlay" class="modal-overlay" style="z-index: 10001; flex-direction: column; background: rgba(0,0,0,0.75);">
    <div class="spinner-mini" style="width: 40px; height: 40px; border-width: 4px; margin-bottom: 16px;"></div>
    <div id="uploadOverlayMsg" style="font-size: 20px; font-weight: bold; margin-bottom: 8px; color: white;">처리 중...</div>
    <div id="uploadOverlaySub" style="font-size: 14px; color: #cbd5e1;">잠시만 기다려주세요.</div>
  </div>

    <script type="module">
      // 1. checklist.js가 export한 모든 함수를 Checklist라는 객체로 한 번에 가져옴
      import * as Checklist from './js/checklist.js';

      // 3. 앱 실행
      Checklist.init();
    </script>

  </body>
</html>
