<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>시스템 접속 중...</title>
  <script src="config.js"></script>
</head>
<body>
  <h2>인증 정보를 확인하고 있습니다...</h2>
  <div id="access-info" style="display: none;">
    <p id="url-str"></p>
    <p id="user-type"></p>
    <p id="target-page"></p>
    <p id="has-checklist-perm"></p>
    <p id="has-archive-perm"></p>
    <p id="next-page"></p>
  </div>
  
  <script>
    const APP_KEY = UTILS.getAuthKey();

    document.getElementById("url-str").innerText = `전체 URL: ${window.location.href} \n쿼리스트링(search): ${window.location.search}`;
    
    if (!APP_KEY) {
      document.body.innerHTML = "<h2>접근 불가: 보안 키가 없습니다.</h2>";
    } else {
      
      fetch(`${CONFIG.GAS_URL}?action=verifyKey&key=${APP_KEY}`)
        .then(res => res.json())
        .then(res => {
          if (res.status === "error") {
            // 키가 만료/폐기된 경우 저장값 비우기
            localStorage.removeItem("APP_KEY");
            localStorage.removeItem("USER_TYPE");
            document.cookie = "APP_KEY=; path=/; max-age=0";
            document.body.innerHTML = `<h2>${res.message}</h2>`;
            return;
          }
          
          const userType = res.userType;
          UTILS.setAuthKey(APP_KEY);
          localStorage.setItem("USER_TYPE", userType); 
  
          let targetPage = getParamFromUrl('p') || 'dashboard';
          let nextPage = "dashboard.html";
          

  
          if (CONFIG.PERMISSIONS.checklist.includes(userType) && targetPage === 'checklist') {
            nextPage = "checklist.html";
          } else if (CONFIG.PERMISSIONS.archive.includes(userType) && targetPage === 'archive') {
            nextPage = "archive.html";
          }

          document.getElementById("access-info").style.display = 'block';
          document.getElementById("user-type").innerText = `받아온 userType: ${userType}`;
          document.getElementById("target-page").innerText = `목표 targetPage: ${targetPage}`;
          document.getElementById("has-checklist-perm").innerText = `체크리스트 권한 포함 여부: ${CONFIG.PERMISSIONS.checklist.includes(userType)}`;
          document.getElementById("has-archive-perm").innerText = `"아카이브 권한 포함 여부: ${CONFIG.PERMISSIONS.archive.includes(userType)}`;
          document.getElementById("next-page").innerText = `넘어갈 페이지: ${nextPage}`;

          debugger;
          
          window.location.replace(`${nextPage}?key=${encodeURIComponent(APP_KEY)}`);
        })
        .catch(err => {
          document.body.innerHTML = "<h2>서버 통신 오류가 발생했습니다.</h2>";
        });
    }
  </script>
</body>
</html>
