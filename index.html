<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>시스템 접속 중...</title>
  <script src="config.js"></script>
</head>
<body>
  <h2 id="msg">인증 정보를 확인하고 있습니다...</h2>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const tempKey = urlParams.get('key');
    const guestTicket = urlParams.get('guest_ticket');
    const targetPage = urlParams.get('p') || 'dashboard';

    // 1. 게스트 QR로 접속한 경우
    if (guestTicket) {
      fetch(`${CONFIG.WORKER_URL}?guest_ticket=${encodeURIComponent(guestTicket)}`, {
        credentials: 'include'
      })
      .then(res => res.json())
      .then(res => handleAuthResponse(res, "checklist"));
    } 
    // 2. 기존 링크(?key=...)로 들어온 경우 (마이그레이션)
    else if (tempKey) {
      fetch(`${CONFIG.WORKER_URL}?action=authenticate&key=${encodeURIComponent(tempKey)}`, {
        credentials: 'include'
      })
      .then(res => res.json())
      .then(res => handleAuthResponse(res, targetPage));
    } 
    // 3. 파라미터 없이 그냥 접속한 경우 (기존에 발급받은 쿠키가 살아있는지 확인)
    else {
      fetch(`${CONFIG.WORKER_URL}?action=checkSession`, {
        credentials: 'include'
      })
      .then(res => res.json())
      .then(res => handleAuthResponse(res, targetPage))
      .catch(() => {
        document.getElementById('msg').innerText = "접근 권한이 없습니다. 관리자에게 링크를 요청하세요.";
      });
    }

    function handleAuthResponse(res, target) {
      if (res.status === "error") {
        localStorage.removeItem("USER_TYPE");
        document.getElementById('msg').innerText = res.message || "인증에 실패했습니다.";
        return;
      }

      // UI용 권한 로컬 저장
      localStorage.setItem("USER_TYPE", res.userType);

      // 페이지 라우팅 (URL에 key 파라미터가 완전히 제거된 상태로 이동)
      let nextPage = "dashboard.html";
      if (CONFIG.PERMISSIONS.checklist.includes(res.userType) && target === 'checklist') {
        nextPage = "checklist.html";
      } else if (CONFIG.PERMISSIONS.archive.includes(res.userType) && target === 'archive') {
        nextPage = "archive.html";
      }

      window.location.replace(nextPage);
    }
  </script>
</body>
</html>
