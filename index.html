<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>시스템 접속 중...</title>
  <script src="config.js"></script>
</head>
<body>
  <h2>인증 정보를 확인하고 있습니다...</h2>
  <script>
    const APP_KEY = UTILS.getAuthKey();
    const urlParams = new URLSearchParams(window.location.search);
    
    if (!APP_KEY) {
      document.body.innerHTML = "<h2>접근 불가: 보안 키가 없습니다.</h2>";
    } else {
      
      fetch(`${CONFIG.GAS_URL}?action=verifyKey&key=${APP_KEY}`)
        .then(res => res.json())
        .then(res => {
          if (res.status === "error") {
            // 키가 만료/폐기된 경우 저장값 비우기
            localStorage.removeItem("APP_KEY");
            localStorage.removeItem("USER_TYPE");
            document.cookie = "APP_KEY=; path=/; max-age=0";
            document.body.innerHTML = `<h2>${res.message}</h2>`;
            return;
          }
          
          const userType = res.userType;
          UTILS.setAuthKey(APP_KEY);
          localStorage.setItem("USER_TYPE", userType); 
  
          let targetPage = urlParams.get('p') || 'dashboard';
          let nextPage = "dashboard.html";
  
          if (CONFIG.PERMISSIONS.checklist.includes(userType) && targetPage === 'checklist') {
            nextPage = "checklist.html";
          } else if (CONFIG.PERMISSIONS.archive.includes(userType) && targetPage === 'archive') {
            nextPage = "archive.html";
          }
          
          window.location.replace(`${nextPage}?key=${encodeURIComponent(APP_KEY)}`);
        })
        .catch(err => {
          document.body.innerHTML = "<h2>서버 통신 오류가 발생했습니다.</h2>";
        });
    }
  </script>
</body>
</html>
